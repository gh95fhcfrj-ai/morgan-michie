<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Morgan 🤍 Michie</title>
<style>
  body { margin:0; font-family:'Poppins',sans-serif; background:#F5F1EA; color:#3D3D3D; text-align:center; }
  .hero { padding:80px 20px; background:linear-gradient(180deg,#F5F1EA 0%,#EDE6DB 100%); }
  h1 { font-size:42px; font-weight:300; color:#C9A96E; margin:0; letter-spacing:2px; }
  .date { font-size:18px; margin:20px 0; opacity:0.8; }
  .box { background:white; max-width:400px; margin:40px auto; padding:30px; border-radius:16px; box-shadow:0 8px 24px rgba(0,0,0,0.06); }
  .btn { background:#C9A96E; color:white; padding:12px 28px; border:none; border-radius:30px; font-size:16px; cursor:pointer; }
  .btn:hover { opacity:0.9; }
  .orchid { font-size:40px; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="hero">
    <div class="orchid">🌸</div>
    <h1>Morgan 🤍 Michie</h1>
    <div class="date">Maret 2027 • Singapore</div>
    <p>Kehadiranmu adalah hadiah terindah</p>
  </div>

  <div class="box">
    <h3>RSVP</h3>
    <p>Beri tahu kami kamu akan datang</p>
    <input placeholder="Nama kamu" style="padding:10px;width:80%;margin:10px 0;border:1px solid #ddd;border-radius:8px;"><br>
    <button class="btn">Konfirmasi Hadir</button>
  </div>
</body>
</html>
